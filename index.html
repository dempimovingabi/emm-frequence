<!DOCTYPE html>
<html lang="fr">
<head>

    <meta name="theme-color" content="#4a148c">
    
    <title>EMM-FREQUENCE</title>
    
    <!-- Lien vers le manifeste (doit être au même niveau que index.html) -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Votre feuille de style -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Vos scripts CDN (j'ai gardé les lignes que vous aviez, mais vous devez remettre les URLs complètes si elles sont coupées) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/..."></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/..."></script>
    <script src="https://cdn.jsdelivr.net/npm/..."></script>
    <script src="https://cdn.jsdelivr.net/npm/..."></script>
    <script src="https://cdn.jsdelivr.net/npm/..."></script>
</head>
<body>

    <!-- ============================================== -->
    <!-- DÉBUT DE VOTRE CONTENU (Splash screen, etc.)  -->
    <!-- ============================================== -->
    
    <div id="splash" class="splash">
        <img src="logos/logo.png" alt="Logo EMM-FREQUENCE">
        <!-- Ajoutez ici le reste de votre contenu splash (titre, chargement, etc.) -->
    </div>

    <!-- ============================================== -->
    <!-- AJOUTEZ ICI LE RESTE DE VOTRE APPLICATION     -->
    <!-- (Menus, tableaux de bord, formulaires, etc.)  -->
    <!-- ============================================== -->
    
    

    <!-- ============================================== -->
    <!-- CODE DU SERVICE WORKER (À LAISSER TOUT EN BAS)-->
    <!-- ============================================== -->
    <script>
      // Enregistrement du Service Worker pour le mode hors ligne et la rapidité
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          // On cherche le fichier sw.js à la racine du projet
          navigator.serviceWorker.register('sw.js') 
            .then(registration => {
              console.log('✅ Service Worker enregistré avec succès. Scope:', registration.scope);
            })
            .catch(error => {
              console.error('❌ Échec de l\'enregistrement du Service Worker:', error);
            });
        });
      }
    </script>

</body>
</html>
